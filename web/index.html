<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Heirloom Table</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="preview-controls" aria-label="Browser preview controls">
  <div id="platform-picker" role="group" aria-label="Preview device">
    <button type="button" data-platform="roku" aria-pressed="true">Roku</button>
    <button type="button" data-platform="fire-tv" aria-pressed="false">Fire TV Stick</button>
  </div>
  <button id="remote-toggle" type="button" aria-controls="remote-dock" aria-expanded="true">Hide remote</button>
</header>
<div id="preview">
  <main id="screen">
    <div id="stage" role="application" aria-label="The Heirloom Table cookbook. Use the arrow keys, Enter, Escape, Space, [ ] and O."></div>
    <div id="exit" hidden><h1>The Heirloom Table</h1><p>The app has closed. Press any remote key to open it again.</p></div>
  </main>
  <aside id="remote-dock" aria-label="On-screen remote">
    <div class="remote roku-remote" data-remote="roku" role="group" aria-label="Roku remote">
      <div class="remote-name">Roku</div>
      <div class="remote-actions">
        <button type="button" data-key="back" title="Back (Esc)" aria-label="Back">↶</button>
        <button type="button" data-key="options" title="Options (O)" aria-label="Options">✱</button>
      </div>
      <div class="direction-pad">
        <button type="button" class="up" data-key="up" aria-label="Up">▲</button>
        <button type="button" class="left" data-key="left" aria-label="Left">◀</button>
        <button type="button" class="select" data-key="OK" title="OK (Enter)">OK</button>
        <button type="button" class="right" data-key="right" aria-label="Right">▶</button>
        <button type="button" class="down" data-key="down" aria-label="Down">▼</button>
      </div>
      <div class="remote-media">
        <button type="button" data-key="rewind" title="Rewind ([)" aria-label="Rewind">◀◀</button>
        <button type="button" data-key="play" title="Play / Pause (Space)" aria-label="Play / Pause">▶Ⅱ</button>
        <button type="button" data-key="fastforward" title="Fast forward (])" aria-label="Fast forward">▶▶</button>
      </div>
    </div>
    <div class="remote fire-remote" data-remote="fire-tv" role="group" aria-label="Fire TV Stick remote" hidden>
      <div class="remote-name">Fire TV</div>
      <div class="direction-pad">
        <button type="button" class="up" data-key="up" aria-label="Up">▲</button>
        <button type="button" class="left" data-key="left" aria-label="Left">◀</button>
        <button type="button" class="select" data-key="OK" title="Select (Enter)" aria-label="Select"></button>
        <button type="button" class="right" data-key="right" aria-label="Right">▶</button>
        <button type="button" class="down" data-key="down" aria-label="Down">▼</button>
      </div>
      <div class="remote-actions">
        <button type="button" data-key="back" title="Back (Esc)" aria-label="Back">↶</button>
        <button type="button" data-key="options" title="Menu (O)" aria-label="Menu">☰</button>
      </div>
      <div class="remote-media">
        <button type="button" data-key="rewind" title="Rewind ([)" aria-label="Rewind">◀◀</button>
        <button type="button" data-key="play" title="Play / Pause (Space)" aria-label="Play / Pause">▶Ⅱ</button>
        <button type="button" data-key="fastforward" title="Fast forward (])" aria-label="Fast forward">▶▶</button>
      </div>
    </div>
  </aside>
</div>

<script src="recipes.js"></script>
<script src="js/ui.js"></script>
<script src="js/home.js"></script>
<script src="js/recipe.js"></script>
<script src="js/cook.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
